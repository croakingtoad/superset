name: Build Windows Desktop (Fork)

# Standalone Windows build for the croakingtoad/superset fork.
# Triggered manually or on pushes to the Tailscale direct-connect branch.
#
# Required fork secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_API_URL        — e.g. https://api.superset.sh
#   NEXT_PUBLIC_WEB_URL        — e.g. https://app.superset.sh
#   NEXT_PUBLIC_ELECTRIC_URL   — ElectricSQL sync endpoint
#   NEXT_PUBLIC_STREAMS_URL    — Durable streams endpoint
#   NEXT_PUBLIC_DOCS_URL       — e.g. https://docs.superset.sh
#   RELAY_URL                  — Relay WebSocket URL
#   GH_CLIENT_ID               — GitHub OAuth app client ID
#   GOOGLE_CLIENT_ID           — Google OAuth client ID
#
# Optional (leave unset to disable analytics / error tracking):
#   NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_HOST
#   SENTRY_DSN_DESKTOP, SENTRY_AUTH_TOKEN

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Build notes (optional, not used in commands)"
        required: false
        type: string
  push:
    branches:
      - feat/tailscale-direct-connect

permissions:
  contents: write

jobs:
  build-windows:
    name: Build - Windows (x64)
    runs-on: windows-2022

    steps:
      - name: Enable long paths (Windows MAX_PATH workaround)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Patch native-keymap for Electron 40 V8 API (C4996)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "keymapping.cc" -Path "node_modules" -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            Set-Content -Path $file.FullName -Value ("#pragma warning(disable: 4996)`r`n" + $content)
            Write-Host "Patched: $($file.FullName)"
          }

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install desktop native dependencies (Windows prebuild)
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_STREAMS_URL: ${{ secrets.NEXT_PUBLIC_STREAMS_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ secrets.NEXT_PUBLIC_ELECTRIC_URL }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: x64
        run: bun run compile:app

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package -- --publish never --config electron-builder.ts --win --x64

      - name: Verify installer was produced
        shell: bash
        working-directory: apps/desktop
        run: |
          ls -la release/
          EXE=$(ls release/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::No .exe installer found in apps/desktop/release/"
            exit 1
          fi
          echo "Installer: $EXE"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: superset-windows-x64-installer
          path: apps/desktop/release/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload auto-update manifest
        uses: actions/upload-artifact@v4
        with:
          name: superset-windows-x64-update-manifest
          path: apps/desktop/release/latest.yml
          retention-days: 30
          if-no-files-found: warn

      - name: Publish to GitHub Releases (rolling windows-latest tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create windows-latest \
            --title "Windows Build — Tailscale Direct Connect" \
            --notes "Custom Windows build with Tailscale direct connect support (feat/tailscale-direct-connect). Install and use as normal; configure direct connection under Settings → Hosts → [remote host] → Direct Connection." \
            --latest \
            apps/desktop/release/*.exe
